# ayman-hub spokes: one block per service, in the agreed connection order (8 Nov 2026).
#
# Every spoke stays `enabled = false` until its step is built and tested.
# Real keys never go in this file: `auth_env` / `header_env` / `env_passthrough`
# name environment variables, loaded on the server from an owner-only env file.
#
# Agents see each tool as <spoke>__<tool>. On top of what's set here, the hub blocks
# send, pay, delete, share, invite, post, merge, schedule, submit and cancel-type tools
# in code (ayman_hub/policy.py).
#
# Reads are tools whose names start with a read verb (get, list, search, read, query...)
# and contain no write verb. Everything else is a write, and WRITES ARE BLOCKED UNLESS LISTED.
#
# mode:              read-only  -> reads only (allow_tools may vouch for reads with odd names)
#                    read-write -> reads, plus the writes in allow_tools
# deny_tools:        glob patterns that are always refused on this spoke (any case)
# allow_tools:       writes allowed on this spoke (and reads whose names don't say so)
# allow_destructive: listed writes the service doesn't mark safe. No marking counts as unsafe.
# allow_actions:     for menu tools with an `action` argument: the actions allowed
# confirm_args:      arguments that confirm a write (Helm's `confirm`). Refused unless the
# confirm_clients:   client is listed here. Empty = agents preview, Ayman confirms himself.
# clients:           if set, only these hub clients may use the spoke
#
# Day one of each spoke: switch it on, call hub__status, and read `hidden_tools` to see what
# is held back and why. Add only what's needed.

[hub]
name = "ayman-hub"
# Set to the public host name before the hub goes on the internet, e.g. ["hub.example.com"].
allowed_hosts = []

# auth:              bearer (default when auth_env is set) -> Authorization: Bearer $auth_env
#                    oauth -> one-time `ayman-hub login <spoke>`; stored owner-only, refreshed on its own

# 1. Linear: cards and comments for longer work. Deletes blocked (also blocked in code).
#    Linear's MCP takes a personal API key as a bearer token (confirmed 8 Nov 2026).
[spokes.linear]
enabled = false
transport = "http"
url = "https://mcp.linear.app/mcp"
auth_env = "LINEAR_API_KEY"
mode = "read-write"
deny_tools = ["*delete*", "*archive*", "*retire*"]
# Cards and comments only. Merging code (merge_diff) and sharing are blocked in code.
allow_tools = ["save_issue", "save_comment"]
allow_destructive = ["save_issue", "save_comment"]
description = "Linear (step 1)"

# 2. Notion: knowledge base. Read; create pages (Proposed KB entries); no deletes or moves.
#    Notion's hosted MCP takes sign-in only, no tokens (confirmed 8 Nov 2026). Sign in as Ayman.
[spokes.notion]
enabled = false
transport = "http"
url = "https://mcp.notion.com/mcp"
auth = "oauth"
mode = "read-write"
deny_tools = ["*delete*", "*move*", "*duplicate*", "*share*", "*restore*", "*calendar*"]
# New pages only (Proposed knowledge-base entries) and comments. No edits to existing pages.
allow_tools = ["notion-create-pages", "notion-create-comment"]
allow_destructive = ["notion-create-pages", "notion-create-comment"]
description = "Notion (step 2)"

# 3. Granola: meeting notes and transcripts, read-only.
#    Granola's MCP takes browser sign-in only (confirmed 8 Nov 2026).
[spokes.granola]
enabled = false
transport = "http"
url = "https://mcp.granola.ai/mcp"
auth = "oauth"
mode = "read-only"
description = "Granola (step 3)"

# 4. Google: Drive, Docs, Sheets, Slides and Calendar. Read; create and edit files;
#    no sharing, permission changes or trash; calendar read-only for now.
#    The hub's own spoke (ayman_hub/spokes/google.py): no share, access, move, trash or
#    calendar-change tools exist in it at all. One Google sign-in for this and Gmail:
#    `ayman-hub google-login` (refuses any account but ayman@telemachus.io). Calendar is
#    signed in read-only. The Google OAuth client id and secret come from the env file.
[spokes.google]
enabled = false
transport = "stdio"
command = "@python"
# Files shared beyond these domains, or by link, are never written to.
args = ["-m", "ayman_hub.spokes.google", "--internal-domains", "telemachus.io"]
env_passthrough = ["GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET"]
mode = "read-write"
deny_tools = ["*share*", "*permission*", "*trash*", "calendar_*create*", "calendar_*update*", "calendar_*respond*"]
# Creating and editing: approved ("read, create and edit"). Remove a name to turn it off.
allow_tools = ["docs_create", "docs_append_text", "docs_replace_text", "sheets_create", "sheets_append_rows",
               "sheets_update_range", "slides_create", "slides_replace_text"]
allow_destructive = ["docs_replace_text", "sheets_update_range", "slides_replace_text"]
description = "Drive, Docs, Sheets, Slides, Calendar (step 4)"

# 5. Gmail: ayman@telemachus.io plus the six logistics@ group mailboxes that arrive in it.
#    The hub's own spoke (ayman_hub/spokes/gmail.py): read, search by mailbox, label, archive,
#    create labels. No send, reply, forward, draft, trash, delete or unsubscribe tool exists.
#    Drafts stay off until Ayman allows them (connectors.md). Never retries a 429.
[spokes.gmail]
enabled = false
transport = "stdio"
command = "@python"
args = ["-m", "ayman_hub.spokes.gmail"]
env_passthrough = ["GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET"]
allow_tools = ["gmail_label_thread", "gmail_archive_thread", "gmail_create_label"]
mode = "read-write"
deny_tools = ["*spam*", "*filter*", "*forward*", "*vacation*"]
description = "Gmail, 7 mailboxes (step 5)"

# 6. Slack: read everything; posting only through a reviewed two-step tool, bot channels only.
#    Slack's MCP needs our own Slack app with MCP turned on; its client id and secret come
#    from the env file and are never written to the hub home (confirmed 8 Nov 2026).
#    On deploy day: add the redirect address below to the Slack app, then `ayman-hub login slack`.
[spokes.slack]
enabled = false
transport = "http"
url = "https://mcp.slack.com/mcp"
auth = "oauth"
oauth_client_id_env = "SLACK_OAUTH_CLIENT_ID"
oauth_client_secret_env = "SLACK_OAUTH_CLIENT_SECRET"
mode = "read-only"
description = "Slack (step 6)"

# 7. Helm: look-ups; writes only as previews. Helm's own preview -> confirm token stays the second lock.
#    Endpoint and login: still to get from Arthur (a server login for the hub).
[spokes.helm]
enabled = false
transport = "http"
url = ""
auth_env = "HELM_TOKEN"
mode = "read-write"
deny_tools = ["payment_runs", "*pay*", "*refund*"]
# Reads whose names don't say so, the area menus, and writes that only ever preview here.
allow_tools = ["commercial_status", "customer_detail", "order_detail", "order_shipments", "order_timeline",
               "product_detail", "stock_levels", "exceptions", "sales_invoices", "purchase_orders",
               "workspace", "helm_orders", "helm_invoices", "helm_customers", "helm_catalogue",
               "helm_buying", "helm_bills", "helm_finance", "helm_admin",
               "update_order", "edit_product", "report_problem"]
allow_destructive = ["update_order", "edit_product", "report_problem"]
# Agents preview Helm writes; nobody confirms through the hub until Ayman says which apps may.
confirm_args = ["confirm", "confirm_token"]
confirm_clients = []
description = "Helm (step 7)"

# Menus: only "help" until each area's actions are reviewed on deploy day.
[spokes.helm.allow_actions]
helm_orders = ["help"]
helm_invoices = ["help"]
helm_customers = ["help"]
helm_catalogue = ["help"]
helm_buying = ["help"]
helm_bills = ["help"]
helm_finance = ["help"]
helm_admin = ["help"]

# 8. WhatsApp (optional, separate decision): read-only, send tools removed.
[spokes.whatsapp]
enabled = false
transport = "stdio"
command = ""
mode = "read-only"
deny_tools = ["send_*", "download_media"]
description = "WhatsApp, optional (step 8)"
